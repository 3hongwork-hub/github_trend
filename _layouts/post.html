---
layout: default
---

<article class="post-detail-container" itemscope itemtype="http://schema.org/BlogPosting">
  <header class="post-header-section">
    <div class="post-header-meta">
      <span class="post-date-badge">📅 {{ page.date | date: "%Y년 %m월 %d일" }}</span>
      {% if page.categories %}
        <span class="post-cat-badge">{{ page.categories | join: " / " }}</span>
      {% endif %}
    </div>
    <h1 class="post-detail-title" itemprop="name headline">{{ page.title | escape }}</h1>
    {% if page.description %}
      <p class="post-detail-description">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="post-content-body" itemprop="articleBody">
    {{ content }}
  </div>

  <footer class="post-footer-nav">
    <a href="{{ "/" | relative_url }}" class="back-to-list-btn">← 전체 글 목록으로 돌아가기</a>
  </footer>
</article>
