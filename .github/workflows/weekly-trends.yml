name: Weekly GitHub Trends Auto Generator

on:
  schedule:
    # 매주 토요일 18:00 KST (09:00 UTC)
    - cron: '0 9 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Commit & Push Auto-Generated Trends
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git status
          git add .
          git commit -m "docs: Auto-generate weekly GitHub trends report [skip ci]" || echo "No changes to commit"
          git push origin main
